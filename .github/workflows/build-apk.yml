name: Build Nileside City APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nileside_city_godot_v0_1_fixed_v3.zip"
      - ".github/workflows/build-apk.yml"
      - "game/**"

permissions:
  contents: write

concurrency:
  group: nileside-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use checked-in Godot project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="game"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          test -f "$PROJECT_DIR/assets/characters/player_walk.png"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Normalize Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          preset = root / "export_presets.cfg"
          project = root / "project.godot"
          p = preset.read_text(encoding="utf-8")
          if 'name="Android Debug"' not in p or 'platform="Android"' not in p:
              raise SystemExit("Android Debug export preset is missing")
          p = "\n".join(line for line in p.splitlines()
                          if not line.strip().startswith(("gradle_build/min_sdk=", "gradle_build/target_sdk="))) + "\n"
          p = re.sub(r"^script_export_mode=.*$", "script_export_mode=0", p, flags=re.M)
          preset.write_text(p, encoding="utf-8")
          text = project.read_text(encoding="utf-8")
          if "[rendering]" not in text:
              text += "\n[rendering]\n"
          required = {
              "renderer/rendering_method": '"gl_compatibility"',
              "renderer/rendering_method.mobile": '"gl_compatibility"',
              "textures/vram_compression/import_etc2_astc": "true",
          }
          start = text.index("[rendering]")
          match = re.search(r"\n\[[^\]]+\]", text[start + len("[rendering]"):])
          end = len(text) if not match else start + len("[rendering]") + match.start()
          section = text[start:end]
          for key, value in required.items():
              line = f"{key}={value}"
              pattern = re.compile(rf"^{re.escape(key)}=.*$", re.M)
              section = pattern.sub(line, section) if pattern.search(section) else section.rstrip() + "\n" + line + "\n"
          project.write_text(text[:start] + section + text[end:], encoding="utf-8")
          PY

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf godot-bin godot.zip
          mkdir -p godot-bin
          curl --location --fail --retry 3 --retry-delay 3 --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$(realpath "$GODOT_BIN")" >> "$GITHUB_ENV"

      - name: Import project assets
        id: import
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import --verbose 2>&1 | tee import.log

      - name: Run pre-build startup test
        id: startup
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 180 --verbose 2>&1 | tee startup.log
          STATUS=${PIPESTATUS[0]}
          PATTERN="SCRIPT ERROR|Parse Error|Compile Error|Failed to compile depended scripts|Failed to load script|Failed loading resource|Error loading resource|Invalid access|Invalid call|Nonexistent function|Cannot infer the type|Warning treated as error"
          if grep -Eiq "$PATTERN" startup.log; then exit 1; fi
          exit "$STATUS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./${{ env.PROJECT_DIR }}/
          export_debug: true
          cache: true
          use_preset_export_path: true
          presets_to_export: Android Debug
          verbose: true

      - name: Find exported APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR" "$HOME/.local/share/godot" -type f -name '*.apk' 2>/dev/null | head -n 1)"
          test -n "$APK_FILE"
          test -s "$APK_FILE"
          echo "APK_FILE=$(realpath "$APK_FILE")" >> "$GITHUB_ENV"
          ls -lh "$APK_FILE"

      - name: Upload APK artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: NilesideCity-Android-Debug-v3
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "import_outcome=${{ steps.import.outcome }}"
            echo "startup_outcome=${{ steps.startup.outcome }}"
            echo "export_outcome=${{ steps.export.outcome }}"
            echo "find_apk_outcome=${{ steps.find_apk.outcome }}"
            echo "artifact_outcome=${{ steps.artifact.outcome }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-results/build-status.txt
          cp import.log ci-results/build-import.log 2>/dev/null || true
          cp startup.log ci-results/build-startup.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results
          git commit -m "Record APK build result" || exit 0
          git push
