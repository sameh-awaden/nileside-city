name: Diagnose Nileside Startup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nileside_city_godot_v0_1_fixed_v3.zip"
      - ".github/workflows/startup-test.yml"

permissions:
  contents: write

concurrency:
  group: nileside-startup-diagnostic
  cancel-in-progress: true

jobs:
  diagnose-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./nileside_city_godot_v0_1_fixed_v3.zip"
          test -f "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/scenes/main.tscn"
          test -f "$PROJECT_DIR/scripts/main.gd"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf godot-bin godot.zip
          mkdir -p godot-bin
          curl --location --fail --retry 3 --retry-delay 3 --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$(realpath "$GODOT_BIN")" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project assets
        id: import
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import --verbose 2>&1 | tee import.log

      - name: Run project startup test
        id: startup
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 180 --verbose 2>&1 | tee startup.log
          GODOT_STATUS=${PIPESTATUS[0]}
          ERROR_PATTERN="SCRIPT ERROR|Parse Error|Compile Error|Failed to compile depended scripts|Failed to load script|Failed loading resource|Error loading resource|Invalid access|Invalid call|Nonexistent function|Cannot call method|Attempt to call|Cannot assign|not found in base|Stack overflow|Cannot infer the type|Warning treated as error"
          grep -Ein "$ERROR_PATTERN" startup.log || true
          if grep -Eiq "$ERROR_PATTERN" startup.log; then exit 1; fi
          exit "$GODOT_STATUS"

      - name: Publish diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "import_outcome=${{ steps.import.outcome }}"
            echo "startup_outcome=${{ steps.startup.outcome }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-results/startup-status.txt
          cp import.log ci-results/import.log 2>/dev/null || true
          cp startup.log ci-results/startup.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results
          git commit -m "Record startup diagnostic result" || exit 0
          git push

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nileside-Startup-Diagnostic-Logs
          path: |
            import.log
            startup.log
          if-no-files-found: warn
          retention-days: 7
